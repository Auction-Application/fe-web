<section class="pd-inl-40 bg-inherit">
  <section class="d-grid place-content-center pd-bl-20">
    <tui-stepper [activeItemIndex]="1" class="bg-inherit">
      @for (step of steps; track step) {
        <button tuiStep>
          {{ step }}
        </button>
      }
    </tui-stepper>
  </section>

  <section class="mr-t-32 d-block bg-inherit pd-b-32">
    <app-item-details></app-item-details>
    <app-media-upload></app-media-upload>
    <app-pricing></app-pricing>
  </section>
</section>
